<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://dsmiokncislpdwhauleu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_FGXia9BmU2mW2yYv9iwfxw_hvhMFnbB";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
STATE
===================================================== */

let employees = [];
let locations = [];
let jobs = [];

let weekOffset = 0;


/* =====================================================
AUTH
===================================================== */

async function checkAuth(){

const {
data,
error
} =
await supabaseClient.auth.getSession();


if(error || !data.session){

window.location.href =
"login.html";

return false;

}


const email =
data.session.user.email || "CA";


document.getElementById(
"profile"
).textContent =
email.substring(0,2).toUpperCase();


return true;

}


/* =====================================================
NAVIGATION
===================================================== */

function goDashboard(){

window.location.href =
"dashboard.html";

}


function goPersoneel(){

window.location.href =
"personeel.html";

}


function goLocaties(){

window.location.href =
"locaties.html";

}


function goLeads(){

window.location.href =
"dashboard.html";

}


/* =====================================================
LOGOUT
===================================================== */

async function logout(){

await supabaseClient.auth.signOut();

window.location.href =
"login.html";

}


/* =====================================================
LOAD EMPLOYEES
===================================================== */

async function loadEmployees(){

const {
data,
error
} =
await supabaseClient
.from("employees")
.select("*")
.order("name",{ascending:true});


if(error){

showError(
"Medewerkers laden mislukt: " +
error.message
);

return;

}


employees =
data || [];


const filter =
document.getElementById(
"employeeFilter"
);


const employeeSelect =
document.getElementById(
"jobEmployee"
);


filter.innerHTML = `
<option value="">
Alle medewerkers
</option>
`;


employeeSelect.innerHTML = `
<option value="">
Kies medewerker
</option>
`;


employees.forEach(employee => {

const name =
employee.name ||
(
(employee.first_name || "") +
" " +
(employee.last_name || "")
).trim();


filter.innerHTML += `
<option value="${escapeHTML(employee.id)}">
${escapeHTML(name || "Medewerker")}
</option>
`;


employeeSelect.innerHTML += `
<option value="${escapeHTML(employee.id)}">
${escapeHTML(name || "Medewerker")}
</option>
`;

});

}


/* =====================================================
LOAD LOCATIONS
===================================================== */

async function loadLocations(){

const {
data,
error
} =
await supabaseClient
.from("locations")
.select("*")
.order("name",{ascending:true});


if(error){

showError(
"Locaties laden mislukt: " +
error.message
);

return;

}


locations =
data || [];


const select =
document.getElementById(
"jobLocation"
);


select.innerHTML = `
<option value="">
Kies locatie
</option>
`;


locations.forEach(location => {

select.innerHTML += `
<option value="${escapeHTML(location.id)}">
${escapeHTML(location.name || "Locatie")}
</option>
`;

});

}


/* =====================================================
LOAD JOBS
===================================================== */

async function loadJobs(){

const {
data,
error
} =
await supabaseClient
.from("jobs")
.select("*")
.order("job_date",{ascending:true})
.order("start_time",{ascending:true});


if(error){

showError(
"Planning laden mislukt: " +
error.message
);

return;

}


jobs =
data || [];


renderStats();

renderCalendar();

}


/* =====================================================
WEEK HELPERS
===================================================== */

function getMonday(date){

const d =
new Date(date);

const day =
d.getDay();

const diff =
day === 0
? -6
: 1 - day;

d.setDate(
d.getDate() + diff
);

d.setHours(0,0,0,0);

return d;

}


function getCurrentMonday(){

const today =
new Date();

const monday =
getMonday(today);

monday.setDate(
monday.getDate() +
weekOffset * 7
);

return monday;

}


function dateToISO(date){

const year =
date.getFullYear();

const month =
String(
date.getMonth()+1
).padStart(2,"0");

const day =
String(
date.getDate()
).padStart(2,"0");

return `${year}-${month}-${day}`;

}


function formatShortDate(date){

return date.toLocaleDateString(
"nl-NL",
{
day:"numeric",
month:"short"
}
);

}


function formatLongDate(date){

return date.toLocaleDateString(
"nl-NL",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

}


/* =====================================================
CHANGE WEEK
===================================================== */

function changeWeek(amount){

weekOffset += amount;

renderCalendar();

}


function goToday(){

weekOffset = 0;

renderCalendar();

}


/* =====================================================
WEEK LABEL
===================================================== */

function renderWeekLabel(){

const monday =
getCurrentMonday();


const sunday =
new Date(monday);

sunday.setDate(
sunday.getDate()+6
);


document.getElementById(
"weekLabel"
).textContent =
`${formatShortDate(monday)} – ${formatShortDate(sunday)}`;

}


/* =====================================================
STATS
===================================================== */

function renderStats(){

const today =
new Date();


const todayISO =
dateToISO(today);


const monday =
getCurrentMonday();


const sunday =
new Date(monday);

sunday.setDate(
sunday.getDate()+6
);


const mondayISO =
dateToISO(monday);

const sundayISO =
dateToISO(sunday);


const todayCount =
jobs.filter(
job =>
job.job_date === todayISO
).length;


const weekCount =
jobs.filter(
job =>
job.job_date >= mondayISO &&
job.job_date <= sundayISO
).length;


const plannedCount =
jobs.filter(
job =>
job.status === "Gepland"
).length;


const completedCount =
jobs.filter(
job =>
job.status === "Afgerond"
).length;


document.getElementById(
"todayJobs"
).textContent =
todayCount;


document.getElementById(
"weekJobs"
).textContent =
weekCount;


document.getElementById(
"plannedJobs"
).textContent =
plannedCount;


document.getElementById(
"completedJobs"
).textContent =
completedCount;

}


/* =====================================================
RENDER CALENDAR
===================================================== */

function renderCalendar(){

renderWeekLabel();


const monday =
getCurrentMonday();


const employeeFilter =
document.getElementById(
"employeeFilter"
).value;


const statusFilter =
document.getElementById(
"statusFilter"
).value;


const container =
document.getElementById(
"calendar"
);


let html = "";


for(let i=0;i<7;i++){

const date =
new Date(monday);

date.setDate(
date.getDate()+i
);


const iso =
dateToISO(date);


let dayJobs =
jobs.filter(
job =>
job.job_date === iso
);


if(employeeFilter){

dayJobs =
dayJobs.filter(
job =>
String(job.employee_id) ===
String(employeeFilter)
);

}


if(statusFilter){

dayJobs =
dayJobs.filter(
job =>
job.status === statusFilter
);

}


dayJobs.sort(
(a,b) =>
String(a.start_time || "")
.localeCompare(
String(b.start_time || "")
)
);


html += `

<div class="day-card">

<div class="day-header">

<div>

<div class="day-name">

${capitalize(
formatLongDate(date)
)}

</div>

<div class="day-date">
${iso}
</div>

</div>

<div class="day-count">

${dayJobs.length}
${dayJobs.length === 1 ? "opdracht" : "opdrachten"}

</div>

</div>


<div class="job-list">

${
dayJobs.length
?
dayJobs.map(
job => renderJob(job)
).join("")
:
`
<div class="empty">

Geen werkzaamheden gepland.

</div>
`
}

</div>

</div>

`;

}


container.innerHTML =
html;

renderStats();

}


/* =====================================================
RENDER JOB
===================================================== */

function renderJob(job){

const employee =
employees.find(
employee =>
String(employee.id) ===
String(job.employee_id)
);


const location =
locations.find(
location =>
String(location.id) ===
String(job.location_id)
);


const employeeName =
employee?.name ||
(
(employee?.first_name || "") +
" " +
(employee?.last_name || "")
).trim() ||
"Onbekende medewerker";


const locationName =
location?.name ||
"Onbekende locatie";


const time =
job.start_time
?
`${formatTime(job.start_time)}${job.end_time ? " – " + formatTime(job.end_time) : ""}`
:
"Geen tijd";


return `

<div class="job">


<div class="job-time">

${escapeHTML(time)}

</div>


<div class="job-main">

<div class="job-service">

${escapeHTML(
job.service ||
"Schoonmaak"
)}

</div>


<div class="job-meta">

<span>
👷 ${escapeHTML(employeeName)}
</span>

<span>
🏢 ${escapeHTML(locationName)}
</span>

</div>

</div>


<div class="job-actions">

<span class="${jobStatusClass(job.status)}">

${escapeHTML(
job.status || "Gepland"
)}

</span>


<button
class="small-button"
onclick="openJobDetail('${job.id}')"
>
Bekijk
</button>

</div>


</div>

`;

}

/* =====================================================
SAVE JOB
===================================================== */

async function saveJob(event){

event.preventDefault();


const button =
document.getElementById(
"saveJobButton"
);


button.disabled =
true;

button.textContent =
"Opslaan...";


const id =
document.getElementById(
"jobId"
).value;


const jobData = {

employee_id:
document.getElementById(
"jobEmployee"
).value,

location_id:
document.getElementById(
"jobLocation"
).value,

job_date:
document.getElementById(
"jobDate"
).value,

start_time:
document.getElementById(
"jobStart"
).value || null,

end_time:
document.getElementById(
"jobEnd"
).value || null,

service:
document.getElementById(
"jobService"
).value.trim() ||
"Schoonmaak",

status:
document.getElementById(
"jobStatus"
).value,

notes:
document.getElementById(
"jobNotes"
).value.trim() || null

};


let result;


if(id){

result =
await supabaseClient
.from("jobs")
.update(jobData)
.eq("id",id)
.select()
.single();

}

else{

result =
await supabaseClient
.from("jobs")
.insert([jobData])
.select()
.single();

}


if(result.error){

console.error(result.error);

alert(
"Opslaan mislukt:\n\n" +
result.error.message
);

button.disabled =
false;

button.textContent =
"Opdracht opslaan";

return;

}


closeJobModal();


button.disabled =
false;

button.textContent =
"Opdracht opslaan";


await loadJobs();

}

/* =====================================================
DELETE JOB
===================================================== */

async function deleteJob(id){

const job =
jobs.find(
item =>
String(item.id) ===
String(id)
);


if(!job)
return;


const confirmed =
confirm(
"Weet je zeker dat je deze opdracht wilt verwijderen?"
);


if(!confirmed)
return;


const {
error
} =
await supabaseClient
.from("jobs")
.delete()
.eq("id",id);


if(error){

alert(
"Verwijderen mislukt:\n\n" +
error.message
);

return;

}


closeDetailModal();

await loadJobs();

}

CLOSE MODALS

function closeJobModal(){

document.getElementById(
"jobModal"
).classList.remove("show");

}

document.getElementById(
"detailModal"

}


function closeJobOutside(event){

"jobModal"
){

}

}


function closeDetailOutside(event){

event.target.id ===

}

}


/* =====================================================
HELPERS
===================================================== */

function jobStatusClass(status){

if(status === "Gestart")
return "status status-gestart";


if(status === "Afgerond")
return "status status-afgerond";


if(status === "Geannuleerd")
return "status status-geannuleerd";


return "status status-gepland";

}


function formatTime(time){

if(!time)
return "";


return String(time)
.substring(0,5);

}


function capitalize(text){

if(!text)
return "";


return text.charAt(0).toUpperCase() +
text.slice(1);

}


function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showError(message){

document.getElementById(
"errorContainer"
).innerHTML = `

<div class="error-box">

<strong>
Er ging iets mis
</strong>

<br><br>

${escapeHTML(message)}

</div>

`;

}
