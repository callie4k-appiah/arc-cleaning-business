<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bedankt voor uw aanvraag | ARC Cleaning Business</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f8f6;
            color: #111815;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .thank-you {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        .logo {
            width: 190px;
            max-width: 80%;
            height: auto;
            margin-bottom: 30px;
        }

        .check {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #0a5b3e;
            color: white;
            font-size: 40px;
            line-height: 70px;
        }

        h1 {
            margin: 0 0 15px;
            color: #0a5b3e;
            font-size: 32px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #66706b;
            margin: 0 auto 30px;
        }

        .button {
            display: inline-block;
            background: #0a5b3e;
            color: white;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.9;
        }

        .contact {
            margin-top: 25px;
            font-size: 14px;
            color: #7a837e;
        }

        @media (max-width: 600px) {
            .thank-you {
                padding: 40px 22px;
            }

            h1 {
                font-size: 27px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="thank-you">

        <img
            src="arc-logo-reference.jpg"
            alt="ARC Cleaning Business"
            class="logo"
        >

        <div class="check">✓</div>

        <h1>Bedankt voor uw aanvraag!</h1>

        <p>
            Uw offerteaanvraag is goed ontvangen.
            ARC Cleaning Business neemt zo snel mogelijk
            contact met u op.
        </p>

        <a href="index.html" class="button">
            Terug naar ARC Cleaning Business
        </a>

        <div class="contact">
            06 1847 4605 · Amsterdam & omgeving
        </div>

    </div>

</body>
</html>
