<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bedankt voor uw aanvraag | ARC Cleaning Business</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f8f6;
            color: #111815;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .thank-you {
            width: 100%;
            max-width: 620px;

            background: #ffffff;

            border-radius: 24px;

            padding: 50px 30px;

            text-align: center;

            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 190px;
            max-width: 75%;
            height: auto;

            margin-bottom: 30px;
        }

        .check {
            width: 72px;
            height: 72px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #0a5b3e;
            color: #ffffff;

            font-size: 42px;
            font-weight: bold;

            line-height: 72px;
        }

        h1 {
            margin: 0 0 15px;

            color: #0a5b3e;

            font-size: 32px;
            line-height: 1.2;
        }

        p {
            margin: 0 auto 30px;

            max-width: 480px;

            color: #68736d;

            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;

            background: #0a5b3e;
            color: #ffffff;

            text-decoration: none;

            padding: 16px 28px;

            border-radius: 10px;

            font-size: 17px;
            font-weight: bold;

            transition: 0.2s ease;
        }

        .button:hover {
            opacity: 0.9;
        }

        .contact {
            margin-top: 25px;

            color: #7c8580;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .thank-you {
                padding: 40px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 27px;
            }

            p {
                font-size: 16px;
            }

            .button {
                width: 100%;
                padding: 16px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="thank-you">

        <img
            src="arc-logo-reference.jpg"
            alt="ARC Cleaning Business"
            class="logo"
        >

        <div class="check">✓</div>

        <h1>Bedankt voor uw aanvraag!</h1>

        <p>
            Uw offerteaanvraag is goed ontvangen.
            Wij nemen zo snel mogelijk contact met u op
            om uw aanvraag te bespreken.
        </p>

        <a href="index.html" class="button">
            Terug naar ARC Cleaning Business
        </a>

        <div class="contact">
            ARC Cleaning Business · Amsterdam & omgeving<br>
            06 1847 4605
        </div>

    </div>

</body>
</html>
