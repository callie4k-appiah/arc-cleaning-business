<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARC OS — Inloggen</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #111;
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    /* LOGO */
    .logo-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 190px;
      max-width: 75%;
      height: auto;
    }

    /* CARD */
    .login-card {
      background: #ffffff;
      border: 1px solid #dce5df;
      border-radius: 24px;
      padding: 38px 30px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
    }

    .brand {
      text-align: center;
      color: #286247;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 10px;
      color: #111;
    }

    .subtitle {
      text-align: center;
      color: #6b756f;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    /* ERROR */
    .error-message {
      display: none;
      background: #fff1f1;
      border: 1px solid #efc4c4;
      color: #b42318;
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.4;
    }

    /* FORM */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #202522;
    }

    input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid #ccd8d1;
      border-radius: 12px;
      background: #fbfcfb;
      color: #111;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #286247;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(40, 98, 71, 0.10);
    }

    input::placeholder {
      color: #9aa59f;
    }

    /* BUTTON */
    .login-button {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 12px;
      background: #286247;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #1f513a;
    }

    .login-button:active {
      transform: scale(0.99);
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-top: 25px;
      color: #7b847f;
      font-size: 13px;
      line-height: 1.6;
    }

    .footer strong {
      color: #286247;
    }

    /* MOBILE */
    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .login-card {
        padding: 32px 22px;
        border-radius: 20px;
      }

      h1 {
        font-size: 30px;
      }

      .logo {
        width: 170px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- ARC LOGO -->
    <div class="logo-container">
      <img
        src="logo.png"
        alt="ARC Cleaning Business"
        class="logo"
      >
    </div>

    <!-- LOGIN CARD -->
    <section class="login-card">

      <div class="brand">
        ARC CLEANING BUSINESS
      </div>

      <h1>
        ARC OS
      </h1>

      <p class="subtitle">
        Welkom terug.<br>
        Log in om je ARC-dashboard te openen.
      </p>

      <!-- ERROR MESSAGE -->
      <div
        id="errorMessage"
        class="error-message"
      ></div>

      <!-- LOGIN FORM -->
      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            E-mailadres
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="jouw@bedrijf.nl"
            autocomplete="email"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            Wachtwoord
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Je wachtwoord"
            autocomplete="current-password"
            required
          >

        </div>

        <button
          type="submit"
          id="loginButton"
          class="login-button"
        >
          Inloggen
        </button>

      </form>

      <div class="footer">
        <strong>ARC OS</strong><br>
        ARC Cleaning Business
      </div>

    </section>

  </main>


  <script>

    /*
    =====================================================
    ARC OS — SUPABASE CONFIG
    =====================================================
    */

    const SUPABASE_URL =
      "https://dsmiokncislpdwhauleu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_FGXia9BmU2mW2yYv9iwfxw_hvhMFnbB";


    /*
    =====================================================
    CREATE SUPABASE CLIENT
    =====================================================
    */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /*
    =====================================================
    ELEMENTS
    =====================================================
    */

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const errorMessage =
      document.getElementById("errorMessage");


    /*
    =====================================================
    SHOW ERROR
    =====================================================
    */

    function showError(message) {

      errorMessage.textContent = message;

      errorMessage.style.display = "block";

    }


    /*
    =====================================================
    HIDE ERROR
    =====================================================
    */

    function hideError() {

      errorMessage.textContent = "";

      errorMessage.style.display = "none";

    }


    /*
    =====================================================
    CHECK EXISTING LOGIN
    =====================================================
    */

    async function checkSession() {

      const {
        data,
        error
      } = await supabaseClient.auth.getSession();

      if (error) {

        console.error(
          "Session error:",
          error
        );

        return;

      }

      if (data.session) {

        window.location.href =
          "dashboard.html";

      }

    }


    /*
    =====================================================
    LOGIN
    =====================================================
    */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        hideError();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        /*
        BUTTON LOADING
        */

        loginButton.disabled = true;

        loginButton.textContent =
          "Bezig met inloggen...";


        /*
        SUPABASE AUTH
        */

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        /*
        LOGIN ERROR
        */

        if (error) {

          console.error(
            "Login error:",
            error
          );

          showError(
            "Inloggen mislukt. Controleer je e-mailadres en wachtwoord."
          );

          loginButton.disabled = false;

          loginButton.textContent =
            "Inloggen";

          return;

        }


        /*
        LOGIN SUCCESS
        */

        if (data.session) {

          loginButton.textContent =
            "Ingelogd ✓";

          /*
          REDIRECT TO ARC OS
          */

          window.location.href =
            "dashboard.html";

        }

      }
    );


    /*
    =====================================================
    START
    =====================================================
    */

    checkSession();

  </script>

</body>
</html>
