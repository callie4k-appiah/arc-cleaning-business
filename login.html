<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARC OS — Inloggen</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #111815;
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 190px;
      max-width: 75%;
      height: auto;
      object-fit: contain;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #dce5df;
      border-radius: 24px;
      padding: 38px 30px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
    }

    .brand {
      text-align: center;
      color: #286247;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #6b756f;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .error-message {
      display: none;
      background: #fff1f1;
      border: 1px solid #efc4c4;
      color: #b42318;
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 54px;
      padding: 0 16px;
      border: 1px solid #ccd8d1;
      border-radius: 12px;
      background: #fbfcfb;
      color: #111;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #286247;
      box-shadow: 0 0 0 3px rgba(40, 98, 71, 0.10);
    }

    .login-button {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 12px;
      background: #286247;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #1f513a;
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #7b847f;
      font-size: 13px;
      line-height: 1.6;
    }

    .footer strong {
      color: #286247;
    }

    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .login-card {
        padding: 32px 22px;
        border-radius: 20px;
      }

      h1 {
        font-size: 30px;
      }

      .logo {
        width: 170px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="logo-container">

      <img
        src="arc-logo-reference.jpg"
        alt="ARC Cleaning Business"
        class="logo"
      >

    </div>


    <section class="login-card">

      <div class="brand">
        ARC CLEANING BUSINESS
      </div>

      <h1>
        ARC OS
      </h1>

      <p class="subtitle">
        Welkom terug.<br>
        Log in om je ARC-dashboard te openen.
      </p>


      <div
        id="errorMessage"
        class="error-message">
      </div>


      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            E-mailadres
          </label>

          <input
            type="email"
            id="email"
            placeholder="jouw@bedrijf.nl"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Wachtwoord
          </label>

          <input
            type="password"
            id="password"
            placeholder="Je wachtwoord"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          id="loginButton"
          class="login-button">

          Inloggen

        </button>

      </form>


      <div class="footer">

        <strong>ARC OS</strong>
        <br>

        ARC Cleaning Business

      </div>

    </section>

  </main>


  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://dsmiokncislpdwhauleu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_FGXia9BmU2mW2yYv9iwfxw_hvhMFnbB";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================================
       ELEMENTS
    ========================================= */

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const errorMessage =
      document.getElementById("errorMessage");


    /* =========================================
       ERROR
    ========================================= */

    function showError(message) {

      errorMessage.textContent = message;

      errorMessage.style.display = "block";

    }


    function hideError() {

      errorMessage.textContent = "";

      errorMessage.style.display = "none";

    }


    /* =========================================
       CHECK EXISTING SESSION
    ========================================= */

    async function checkSession() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(
          "Session error:",
          error
        );

        return;

      }


      if (data.session) {

        window.location.href =
          "dashboard.html";

      }

    }


    /* =========================================
       LOGIN
    ========================================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        hideError();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "Bezig met inloggen...";


        const {
  data,
  error
} =
  await supabaseClient.auth
    .signInWithPassword({

      email: email,

      password: password

    });


if (error) {

  console.error(
    "Login error:",
    error
  );


  showError(
    "Inloggen mislukt. Controleer je e-mailadres en wachtwoord."
  );


  loginButton.disabled = false;

  loginButton.textContent =
    "Inloggen";

  return;

}


/*
 * Login is succesvol.
 * We controleren nu of dit account
 * gekoppeld is aan een medewerker.
 */

const {
  data: employee,
  error: employeeError
} =
  await supabaseClient
    .from("employees")
    .select(
      "id, user_id, first_name, last_name, status"
    )
    .eq(
      "user_id",
      data.user.id
    )
    .maybeSingle();


/*
 * Er ging iets mis bij het controleren
 * van het medewerkerprofiel.
 */

if (employeeError) {

  console.error(
    "Employee lookup error:",
    employeeError
  );


  showError(
    "Inloggen gelukt, maar het medewerkerprofiel kon niet worden gecontroleerd."
  );


  loginButton.disabled = false;

  loginButton.textContent =
    "Inloggen";

  return;

}


/*
 * ACCOUNT IS EEN MEDEWERKER
 */

if (employee) {

  /*
   * Alleen actieve medewerkers mogen
   * de medewerkeromgeving gebruiken.
   */

  if (
    employee.status &&
    employee.status !== "Actief"
  ) {

    await supabaseClient.auth.signOut();


    showError(
      "Je medewerkeraccount is momenteel niet actief."
    );


    loginButton.disabled = false;

    loginButton.textContent =
      "Inloggen";

    return;

  }


  loginButton.textContent =
    "Ingelogd ✓";


  window.location.href =
    "medewerker.html";


  return;

}


/*
 * GEEN MEDEWERKER GEVONDEN
 *
 * Dit behandelen we als een admin-account.
 */

if (data.session) {

  loginButton.textContent =
    "Ingelogd ✓";


  window.location.href =
    "dashboard.html";

}

              email: email,

              password: password

            });


        if (error) {

          console.error(
            "Login error:",
            error
          );


          showError(
            "Inloggen mislukt. Controleer je e-mailadres en wachtwoord."
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "Inloggen";

          return;

        }


        if (data.session) {

          loginButton.textContent =
            "Ingelogd ✓";


          window.location.href =
            "dashboard.html";

        }

      }
    );


    /* =========================================
       START
    ========================================= */

    checkSession();

  </script>

</body>
</html>
