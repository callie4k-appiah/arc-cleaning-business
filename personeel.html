<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ARC OS — Personeel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f5;
  color:#111815;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  height:72px;
  background:#fff;
  border-bottom:1px solid #dce5df;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand img{
  width:120px;
  height:52px;
  object-fit:contain;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.logout{
  border:1px solid #dce5df;
  background:#fff;
  color:#315b49;
  padding:9px 13px;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
}

.profile{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#286247;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.layout{
  display:flex;
  min-height:calc(100vh - 72px);
}

.sidebar{
  width:240px;
  flex-shrink:0;
  background:#063b2d;
  color:#fff;
  padding:25px 16px;
}

.sidebar-title{
  margin:10px 12px 12px;
  font-size:11px;
  letter-spacing:1.5px;
  opacity:.55;
}

.nav-item{
  width:100%;
  border:0;
  background:transparent;
  color:#dce9e2;
  text-align:left;
  padding:13px 14px;
  margin-bottom:4px;
  border-radius:9px;
  font-size:14px;
  font-weight:600;
}

.nav-item:hover,
.nav-item.active{
  background:#0a5b3e;
  color:#fff;
}

.content{
  flex:1;
  max-width:1450px;
  padding:32px;
  width:100%;
}

.page-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
}

.page-heading h1{
  margin:0;
  font-size:30px;
}

.page-heading p{
  margin:8px 0 0;
  color:#68736e;
  font-size:14px;
}

.button{
  border:0;
  background:#0a5b3e;
  color:#fff;
  padding:13px 18px;
  border-radius:9px;
  font-size:14px;
  font-weight:700;
}

.button:hover{
  background:#084b34;
}

.button.secondary{
  background:#edf2ef;
  color:#0a5b3e;
}

.button.danger{
  background:#fff0f0;
  color:#a52d2d;
}

.button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:28px;
}

.stat-card{
  background:#fff;
  border:1px solid #dce5df;
  border-radius:13px;
  padding:21px;
}

.stat-label{
  color:#68736e;
  font-size:13px;
  margin-bottom:9px;
}

.stat-number{
  color:#0a5b3e;
  font-size:30px;
  font-weight:800;
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search{
  flex:1;
  border:1px solid #d4dfd8;
  border-radius:9px;
  padding:12px 14px;
  background:#fff;
  outline:none;
}

.filter{
  border:1px solid #d4dfd8;
  border-radius:9px;
  padding:12px 14px;
  background:#fff;
  min-width:170px;
}

.card{
  background:#fff;
  border:1px solid #dce5df;
  border-radius:13px;
  padding:22px;
}

.employee-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.employee-card{
  background:#fff;
  border:1px solid #dce5df;
  border-radius:14px;
  padding:20px;
  transition:.15s;
}

.employee-card:hover{
  border-color:#a9c8b8;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.employee-top{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}

.employee-avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  background:#0a5b3e;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:800;
  flex-shrink:0;
}

.employee-name{
  font-size:17px;
  font-weight:800;
}

.employee-role{
  font-size:12px;
  color:#68736e;
  margin-top:4px;
}

.status{
  display:inline-flex;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.status-active{
  background:#dff5e5;
  color:#176738;
}

.status-inactive{
  background:#fbeaea;
  color:#a52d2d;
}

.status-vacation{
  background:#fff1cf;
  color:#8a6200;
}

.employee-info{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin:16px 0;
  font-size:13px;
}

.employee-info-row{
  display:flex;
  gap:8px;
  align-items:flex-start;
}

.employee-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.small-button{
  border:1px solid #dce5df;
  background:#f8faf9;
  color:#315b49;
  padding:9px 8px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  text-align:center;
  text-decoration:none;
}

.small-button:hover{
  background:#edf2ef;
}

.small-button.primary{
  background:#0a5b3e;
  border-color:#0a5b3e;
  color:#fff;
}

.small-button.login{
  background:#eef7f2;
  border-color:#bcd7c8;
  color:#0a5b3e;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#68736e;
}

.empty-icon{
  font-size:38px;
  margin-bottom:10px;
}

.loading{
  text-align:center;
  padding:40px;
  color:#68736e;
}

.error-box{
  background:#fff1f1;
  border:1px solid #efc4c4;
  color:#a52d2d;
  border-radius:10px;
  padding:15px;
  margin-bottom:20px;
  font-size:14px;
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:850px;
  max-height:92vh;
  overflow-y:auto;
  background:#fff;
  border-radius:16px;
  padding:25px;

.modal-header{

}

.modal-header h2{

.close{

}

.form-grid{

  grid-template-columns:1fr 1fr;
  gap:16px;
}

.form-group{

  flex-direction:column;
  gap:7px;
}

.form-group.full{

.form-group label{

  font-weight:700;
}

.form-group input,
.form-group select,

.form-group textarea{

}

.modal-footer{

  justify-content:flex-end;
  gap:10px;

}

.profile-header{

  gap:18px;
  padding-bottom:22px;

.profile-avatar{

.profile-name{

}

.profile-role{

.profile-grid{

  gap:18px;

.profile-box{
  border:1px solid #e1e8e3;

}

.profile-box.full{

}

.profile-box h3{
  margin:0 0 14px;
  font-size:15px;
}

.detail{

}

.detail strong{

  font-size:10px;
  color:#68736e;
  margin-bottom:3px;

}

.contact-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.jobs{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.job{
  border:1px solid #e1e8e3;

  padding:12px;
}

.job-title{
  font-weight:700;

.job-details{

.login-box{

.login-box strong{

@media(max-width:1100px){

  grid-template-columns:repeat(2,1fr);

.stats{

@media(max-width:1000px){

  display:none;

.page-heading{

  grid-column:auto;

.profile-grid{
  grid-template-columns:1fr;
}

.profile-box.full{
  grid-column:auto;
}

.modal-footer{
  flex-direction:column-reverse;
}

.modal-footer button{
  width:100%;
}

}

</style>

</head>

<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://dsmiokncislpdwhauleu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_FGXia9BmU2mW2yYv9iwfxw_hvhMFnbB";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
STATE
===================================================== */

let employees = [];

let locations = [];


/* =====================================================
AUTH
===================================================== */

async function checkAuth(){

const {
data,
error
} =
await supabaseClient.auth.getSession();


if(
error ||
!data.session
){

window.location.href =
"login.html";

return false;

}


const email =
data.session.user.email ||
"CA";


document.getElementById(
"adminProfile"
).textContent =
email
.substring(0,2)
.toUpperCase();


return true;

}


/* =====================================================
LOGOUT
===================================================== */

async function logout(){

await supabaseClient.auth.signOut();

window.location.href =
"login.html";

}


/* =====================================================
NAVIGATION
===================================================== */

function go(page){

window.location.href =
page;

}


/* =====================================================
LOAD LOCATIONS
===================================================== */

async function loadLocations(){

const {
data,
error
} =
await supabaseClient
.from("locations")
.select("*")
.order(
"name",
{
ascending:true
}
);


if(error){

console.error(
"Locations error:",
error
);

locations = [];

return;

}


locations =
data || [];


const select =
document.getElementById(
"employeeLocation"
);


select.innerHTML = `

<option value="">
Geen vaste locatie
</option>

`;


locations.forEach(
location => {

select.innerHTML += `

<option
value="${escapeHTML(location.id)}"
>

${escapeHTML(
location.name ||
"Locatie"
)}

</option>

`;

});

}


/* =====================================================
LOAD EMPLOYEES
===================================================== */

async function loadEmployees(){

const {
data,
error
} =
await supabaseClient
.from("employees")
.select("*")
.order(
"first_name",
{
ascending:true
}
);


if(error){

console.error(
"Employees error:",
error
);


document.getElementById(
"employeesContainer"
).innerHTML = `

<div class="error-box">

<strong>
Medewerkers laden mislukt
</strong>

<br><br>

${escapeHTML(
error.message
)}

</div>

`;

return;

}


employees =
data || [];


renderStats();

renderEmployees();

}


/* =====================================================
STATS
===================================================== */

function renderStats(){

document.getElementById(
"totalEmployees"
).textContent =
employees.length;


document.getElementById(
"activeEmployees"
).textContent =
employees.filter(
employee =>
employee.status === "Actief"
).length;


document.getElementById(
"assignedEmployees"
).textContent =
employees.filter(
employee =>
employee.location_id
).length;


document.getElementById(
"loginEmployees"
).textContent =
employees.filter(
employee =>
employee.user_id
).length;

}


/* =====================================================
EMPLOYEE NAME
===================================================== */

function getEmployeeName(employee){

if(!employee){

return "Onbekende medewerker";

}


return (

(employee.first_name || "") +
" " +

/* =====================================================
INITIALS
===================================================== */

function getInitials(employee){

const first =
employee.first_name ||
"";


const last =
employee.last_name ||
"";


return (

first.charAt(0) +
last.charAt(0)

).toUpperCase() ||
"M";

}


/* =====================================================
LOCATION
===================================================== */

function getLocationName(id){

const location =
locations.find(
item =>
String(item.id) ===
String(id)
);


return location?.name ||
"Geen vaste locatie";

}

).value.trim(),

"employeeRate"
).value

).value ||

postal_code:
document.getElementById(

).value.trim(),

city:
document.getElementById(
"employeeCity"
).value.trim(),

notes:
document.getElementById(
"employeeNotes"
).value.trim()

};


let result;


if(id){

result =
await supabaseClient
.from("employees")

.eq("id",id)
.select()
.single();

}
else{

result =
await supabaseClient
.from("employees")
.insert(

)
.select()
.single();

if(result.error){

);

);

"Medewerker opslaan";

/* =====================================================

===================================================== */

async function createEmployeeLogin(employeeId){

const employee =
employees.find(
item =>
String(item.id) ===
String(employeeId)
);


if(!employee){

alert(
"Medewerker niet gevonden."
);

return;

}


if(employee.user_id){

alert(
"Deze medewerker heeft al een login."
);

return;

}


if(!employee.email){

alert(
"Deze medewerker heeft nog geen e-mailadres."
);

return;

}


const name =
getEmployeeName(employee);


const password =
prompt(

`Maak een tijdelijk wachtwoord voor ${name}.\n\n` +
`Minimaal 8 tekens.`

);


if(password === null){

return;

}


if(password.length < 8){

alert(
"Het wachtwoord moet minimaal 8 tekens bevatten."
);

return;

}


const confirmed =
confirm(

`Login aanmaken voor:\n\n` +

`${name}\n` +

`${employee.email}\n\n` +

`Doorgaan?`

);


if(!confirmed){

return;

}


try{

const {
data:sessionData,
error:sessionError
} =
await supabaseClient
.auth
.getSession();


if(
sessionError ||
!sessionData.session
){

alert(
"Je bent niet ingelogd."
);

return;

}


const response =
await fetch(

`${SUPABASE_URL}/functions/v1/create-employee`,

{

method:"POST",

headers:{

"Authorization":
`Bearer ${sessionData.session.access_token}`,

"apikey":
SUPABASE_PUBLISHABLE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

employee_id:
employee.id,

email:
employee.email,

password:
password

})

}

);


const result =
await response.json();


if(!response.ok){

console.error(
"Create employee login error:",
result
);


alert(

"Login aanmaken mislukt:\n\n" +

(
result.error ||
"Onbekende fout."
)

);

return;

}


alert(

`✅ Login succesvol aangemaakt!\n\n` +

`Medewerker: ${name}\n` +

`E-mail: ${employee.email}\n\n` +

`Tijdelijk wachtwoord:\n${password}\n\n` +

`Geef deze gegevens veilig aan de medewerker.`

);


await loadEmployees();


}
catch(error){

console.error(error);


alert(

"Er ging iets mis:\n\n" +

error.message

);

}

}

/* =====================================================
STATUS
===================================================== */

function statusClass(status){

if(status === "Inactief"){

return "status status-inactive";

}


if(status === "Vakantie"){

return "status status-vacation";

}


return "status status-active";

}


function jobStatusClass(status){

if(status === "Gestart"){

return "status status-vacation";

}


if(status === "Afgerond"){

return "status status-active";

}


if(status === "Geannuleerd"){

return "status status-inactive";

}


return "status status-gepland";

}


/* =====================================================
WHATSAPP
===================================================== */

function whatsappNumber(phone){

return String(
phone || ""
)
.replace(
/\D/g,
""
);

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(
value ?? ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}
