<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARC OS — Personeel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f7f5;
color:#111815;
}

button,input,select,textarea{
font:inherit;
}

button{
cursor:pointer;
}

.topbar{
height:72px;
background:#fff;
border-bottom:1px solid #dce5df;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;
position:sticky;
top:0;
z-index:100;
}

.brand img{
width:120px;
height:52px;
object-fit:contain;
}

.top-actions{
display:flex;
align-items:center;
gap:12px;
}

.logout{
border:1px solid #dce5df;
background:#fff;
color:#315b49;
padding:9px 13px;
border-radius:8px;
font-size:13px;
font-weight:700;
}

.profile{
width:42px;
height:42px;
border-radius:50%;
background:#286247;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.layout{
display:flex;
min-height:calc(100vh - 72px);
}

.sidebar{
width:240px;
flex-shrink:0;
background:#063b2d;
color:#fff;
padding:25px 16px;
}

.sidebar-title{
margin:10px 12px 12px;
font-size:11px;
letter-spacing:1.5px;
opacity:.55;
}

.nav-item{
width:100%;
border:0;
background:transparent;
color:#dce9e2;
text-align:left;
padding:13px 14px;
margin-bottom:4px;
border-radius:9px;
font-size:14px;
font-weight:600;
}

.nav-item:hover,
.nav-item.active{
background:#0a5b3e;
color:#fff;
}

.content{
flex:1;
max-width:1450px;
padding:32px;
width:100%;
}

.page-heading{
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
margin-bottom:28px;
}

.page-heading h1{
margin:0;
font-size:30px;
}

.page-heading p{
margin:8px 0 0;
color:#68736e;
font-size:14px;
}

.button{
border:0;
background:#0a5b3e;
color:#fff;
padding:13px 18px;
border-radius:9px;
font-size:14px;
font-weight:700;
}

.button:hover{
background:#084b34;
}

.button.secondary{
background:#edf2ef;
color:#0a5b3e;
}

.button.danger{
background:#fff0f0;
color:#a52d2d;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px;
margin-bottom:28px;
}

.stat-card{
background:#fff;
border:1px solid #dce5df;
border-radius:13px;
padding:21px;
}

.stat-label{
color:#68736e;
font-size:13px;
margin-bottom:9px;
}

.stat-number{
color:#0a5b3e;
font-size:30px;
font-weight:800;
}

.card{
background:#fff;
border:1px solid #dce5df;
border-radius:13px;
padding:22px;
margin-bottom:20px;
}

.card-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:18px;
}

.card-header h2{
margin:0;
font-size:18px;
}

.toolbar{
display:flex;
gap:12px;
margin-bottom:20px;
}

.search{
flex:1;
border:1px solid #d4dfd8;
border-radius:9px;
padding:12px 14px;
background:#fff;
outline:none;
}

.filter{
border:1px solid #d4dfd8;
border-radius:9px;
padding:12px 14px;
background:#fff;
}

.employee-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
}

.employee-card{
background:#fff;
border:1px solid #dce5df;
border-radius:14px;
padding:20px;
transition:.15s;
}

.employee-card:hover{
border-color:#a9c8b8;
box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.employee-top{
display:flex;
align-items:center;
gap:14px;
margin-bottom:18px;
}

.avatar{
width:52px;
height:52px;
border-radius:50%;
background:#0a5b3e;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:17px;
flex-shrink:0;
}

.employee-name{
font-size:17px;
font-weight:800;
}

.employee-role{
font-size:12px;
color:#68736e;
margin-top:4px;
}

.employee-info{
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:18px;
font-size:13px;
}

.employee-info div{
display:flex;
gap:8px;
}

.employee-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.small-button{
border:1px solid #dce5df;
background:#f8faf9;
color:#315b49;
padding:9px 10px;
border-radius:8px;
font-size:12px;
font-weight:700;
text-align:center;
text-decoration:none;
}

.small-button:hover{
background:#edf2ef;
}

.small-button.primary{
background:#0a5b3e;
color:#fff;
border-color:#0a5b3e;
}

.status{
display:inline-flex;
padding:5px 9px;
border-radius:20px;
font-size:11px;
font-weight:700;
}

.status-active{
background:#dff5e5;
color:#176738;
}

.status-inactive{
background:#fbeaea;
color:#a52d2d;
}

.status-vacation{
background:#fff1cf;
color:#8a6200;
}

.empty{
text-align:center;
padding:45px 20px;
color:#68736e;
}

.empty-icon{
font-size:36px;
margin-bottom:12px;
}

.modal-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.48);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:1000;
}

.modal-overlay.show{
display:flex;
}

.modal{
width:100%;
max-width:850px;
max-height:92vh;
overflow-y:auto;
background:#fff;
border-radius:16px;
padding:25px;
}

.modal-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:22px;
}

.modal-header h2{
margin:0;
font-size:22px;
}

.close{
border:0;
background:#edf2ef;
width:36px;
height:36px;
border-radius:50%;
font-size:20px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

.form-group{
display:flex;
flex-direction:column;
gap:7px;
}

.form-group.full{
grid-column:1/-1;
}

.form-group label{
font-size:13px;
font-weight:700;
}

.form-group input,
.form-group select,
.form-group textarea{
width:100%;
border:1px solid #d4dfd8;
border-radius:8px;
padding:12px;
outline:none;
background:#fff;
}

.form-group textarea{
min-height:100px;
resize:vertical;
}

.modal-footer{
display:flex;
justify-content:flex-end;
gap:10px;
margin-top:22px;
}

.profile-modal{
max-width:900px;
}

.profile-header{
display:flex;
align-items:center;
gap:18px;
padding-bottom:22px;
border-bottom:1px solid #edf1ee;
margin-bottom:22px;
}

.profile-avatar{
width:78px;
height:78px;
border-radius:50%;
background:#0a5b3e;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
font-weight:800;
}

.profile-name{
font-size:24px;
font-weight:800;
}

.profile-role{
color:#68736e;
margin-top:5px;
}

.profile-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.profile-box{
border:1px solid #e1e8e3;
border-radius:12px;
padding:18px;
}

.profile-box h3{
margin:0 0 14px;
font-size:15px;
}

.detail{
margin-bottom:10px;
font-size:13px;
}

.detail strong{
display:block;
font-size:11px;
color:#68736e;
margin-bottom:3px;
text-transform:uppercase;
letter-spacing:.5px;
}

.contact-buttons{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.jobs{
display:flex;
flex-direction:column;
gap:10px;
}

.job{
padding:12px;
border:1px solid #edf1ee;
border-radius:9px;
background:#fafcfb;
}

.job-title{
font-weight:700;
font-size:13px;
}

.job-details{
font-size:12px;
color:#68736e;
margin-top:4px;
}

.loading{
text-align:center;
padding:35px;
color:#68736e;
}

.error-box{
background:#fff1f1;
border:1px solid #efc4c4;
color:#a52d2d;
border-radius:10px;
padding:15px;
margin-bottom:20px;
font-size:14px;
}

@media(max-width:1100px){

.employee-grid{
grid-template-columns:repeat(2,1fr);
}

.stats{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:1000px){

.sidebar{
display:none;
}

.content{
padding:24px 18px;
}

}

@media(max-width:600px){

.topbar{
height:68px;
padding:0 14px;
}

.brand img{
width:110px;
}

.content{
padding:20px 14px;
}

.page-heading{
flex-direction:column;
align-items:flex-start;
}

.page-heading h1{
font-size:26px;
}

.page-heading .button{
width:100%;
}

.employee-grid{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:1fr 1fr;
gap:10px;
}

.form-grid{
grid-template-columns:1fr;
}

.form-group.full{
grid-column:auto;
}

.profile-grid{
grid-template-columns:1fr;
}

.modal-footer{
flex-direction:column-reverse;
}

.modal-footer button{
width:100%;
}

.logout{
display:none;
}

}

</style>
</head>

<body>

<header class="topbar">

<div class="brand">

</div>

<div class="top-actions">

Uitloggen
</button>

CA
</div>

</div>

<div class="layout">

<aside class="sidebar">

<div class="sidebar-title">
ARC OS
</div>

📊 Dashboard
</button>

<button class="nav-item" onclick="go('leads.html')">
👥 Leads

<button class="nav-item" onclick="go('followups.html')">

<button class="nav-item" onclick="go('offertes.html')">

</button>

BEHEER

<main class="content">

<div>

</h1>

</p>

</div>

+ Nieuwe medewerker

Totaal personeel

0

</div>


<div class="stat-card">

<div class="stat-label">

<div class="toolbar">

>

>

</main>

</div>


<!-- =====================================================
EMPLOYEE MODAL
===================================================== -->

<div
class="modal-overlay"
id="employeeModal"
onclick="closeEmployeeOutside(event)"
>

class="modal"
onclick="event.stopPropagation()"
>

Nieuwe medewerker

class="close"
onclick="closeEmployeeModal()"
>
×

id="employeeForm"

>

id="employeeId"
>

<div class="form-group">

<label>

id="employeeName"

>

>

Adres
</label>

id="employeeAddress"
placeholder="Straat + huisnummer"
>

</div>


<div class="form-group">

<label>
Postcode
</label>

<input
id="employeePostalCode"

>

</div>


<div class="form-group full">

<label>
Plaats
</label>

<input
id="employeeCity"
value="Amsterdam"
>

</div>


<div class="form-group full">

<label>
Notities
</label>

<textarea
id="employeeNotes"

></textarea>

</div>

<!-- =====================================================
PROFILE MODAL
===================================================== -->

<div
class="modal-overlay"
id="profileModal"
onclick="closeProfileOutside(event)"
>

class="modal profile-modal"
onclick="event.stopPropagation()"
>

<div class="modal-header">

<h2>
Medewerkerprofiel
</h2>

<button
class="close"
onclick="closeProfileModal()"
>
×
</button>

</div>


<div id="profileContent">
</div>

</div>

<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://dsmiokncislpdwhauleu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_FGXia9BmU2mW2yYv9iwfxw_hvhMFnbB";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
DATA
===================================================== */

let employees = [];
let locations = [];


/* =====================================================
AUTH
===================================================== */

async function checkAuth(){

const {
data,
error
} =
await supabaseClient.auth.getSession();

if(error || !data.session){

window.location.href =
"login.html";

return;

}

await loadLocations();

await loadEmployees();

}


/* =====================================================
LOGOUT
===================================================== */

async function logout(){

await supabaseClient.auth.signOut();

window.location.href =
"login.html";

}


/* =====================================================
NAVIGATION
===================================================== */

function go(page){

window.location.href = page;

}


/* =====================================================
LOAD LOCATIONS
===================================================== */

async function loadLocations(){

const {
data,
error
} =
await supabaseClient
.from("locations")
.select("*")
.order("name",{ascending:true});


if(error){

console.error(error);

locations = [];

return;

}


locations =
data || [];


const select =
document.getElementById(
"employeeLocation"
);


select.innerHTML = `
<option value="">
Geen vaste locatie
</option>
`;


locations.forEach(location => {

select.innerHTML += `
<option value="${escapeHTML(location.id)}">
${escapeHTML(location.name || "Locatie")}
</option>
`;

});

}


/* =====================================================
LOAD EMPLOYEES
===================================================== */

async function loadEmployees(){

const {
data,
error
} =
await supabaseClient
.from("employees")
.select(`
*,
locations (
id,
name
)
`)
.order("created_at",{ascending:false});


if(error){

console.error(error);

document.getElementById(
"employeesContainer"
).innerHTML = `

<div class="error-box">

<strong>
Database fout
</strong>

<p>
${escapeHTML(error.message)}
</p>

</div>

`;

return;

}


employees =
data || [];


renderStats();

renderEmployees();

}


/* =====================================================
STATS
===================================================== */

function renderStats(){

document.getElementById(
"totalEmployees"
).textContent =
employees.length;


document.getElementById(
"activeEmployees"
).textContent =
employees.filter(
employee =>
employee.status === "Actief"
).length;


document.getElementById(
"assignedEmployees"
).textContent =
employees.filter(
employee =>
employee.location_id
).length;


document.getElementById(
"availableEmployees"
).textContent =
employees.filter(
employee =>
employee.status === "Actief" &&
!employee.location_id
).length;

}


/* =====================================================
RENDER EMPLOYEES
===================================================== */

function renderEmployees(){

const container =
document.getElementById(
"employeesContainer"
);


const search =
(
document.getElementById(
"search"
).value || ""
)
.toLowerCase();


const filter =
document.getElementById(
"statusFilter"
).value;


const filtered =
employees.filter(employee => {

const text = [

employee.name,
employee.email,
employee.phone,
employee.job_title,
employee.city

]
.filter(Boolean)
.join(" ")
.toLowerCase();


const matchesSearch =
text.includes(search);


const matchesStatus =
filter === "Alle" ||
employee.status === filter;


return (
matchesSearch &&
matchesStatus
);

});


if(!filtered.length){

container.innerHTML = `

<div class="empty">

<div class="empty-icon">
👷
</div>

<strong>
Geen medewerkers gevonden
</strong>

<p>
Voeg een medewerker toe of pas je zoekopdracht aan.
</p>

</div>

`;

return;

}


container.innerHTML = `

<div class="employee-grid">

${filtered.map(employee => {

const initials =
getInitials(employee.name);


const location =
employee.locations?.name ||
"Geen locatie";


return `

<div class="employee-card">

<div class="employee-top">

<div class="avatar">
${escapeHTML(initials)}
</div>

<div>

<div class="employee-name">
${escapeHTML(employee.name || "Naam onbekend")}
</div>

<div class="employee-role">
${escapeHTML(employee.job_title || "Medewerker")}
</div>

</div>

</div>


<div style="margin-bottom:14px">

<span class="${statusClass(employee.status)}">

${escapeHTML(employee.status || "Actief")}

</span>

</div>


<div class="employee-info">

<div>
📞
<span>
${escapeHTML(employee.phone || "Geen telefoonnummer")}
</span>
</div>

<div>
✉️
<span>
${escapeHTML(employee.email || "Geen e-mailadres")}
</span>
</div>

<div>
📍
<span>
${escapeHTML(location)}
</span>
</div>

<div>
💶
<span>
${employee.hourly_rate
? "€ " + Number(employee.hourly_rate).toFixed(2) + " per uur"
: "Uurloon niet ingesteld"}
</span>
</div>

</div>


<div class="employee-actions">

<button
class="small-button primary"
onclick="openProfile('${employee.id}')"
>
👤 Profiel
</button>

<button
class="small-button"
onclick="editEmployee('${employee.id}')"
>
✏️ Bewerken
</button>


${
employee.phone
?
`
<a
class="small-button"
href="tel:${escapeHTML(employee.phone)}"
>
📞 Bellen
</a>
`
:
`
<div class="small-button">
📞 Bellen
</div>
`
}


${
employee.phone
?
`
<a

/* =====================================================
SAVE EMPLOYEE
===================================================== */

async function saveEmployee(event){

event.preventDefault();


const button =
document.getElementById(
"saveEmployeeButton"
);


button.disabled = true;

button.textContent =
"Opslaan...";


const id =
document.getElementById(
"employeeId"
).value;


const employeeData = {

name:
document.getElementById(
"employeeName"
).value.trim(),

job_title:
document.getElementById(
"employeeJobTitle"
).value.trim(),

email:
document.getElementById(
"employeeEmail"
).value.trim(),

phone:
document.getElementById(
"employeePhone"
).value.trim(),

status:
document.getElementById(
"employeeStatus"
).value,

hourly_rate:
document.getElementById(
"employeeRate"
).value
?
Number(
document.getElementById(
"employeeRate"
).value
)
:
null,

location_id:
document.getElementById(
"employeeLocation"
).value
||
null,

address:
document.getElementById(
"employeeAddress"
).value.trim(),

postal_code:
document.getElementById(
"employeePostalCode"
).value.trim(),

city:
document.getElementById(
"employeeCity"
).value.trim(),

notes:
document.getElementById(
"employeeNotes"
).value.trim(),

updated_at:
new Date().toISOString()

};


let result;


if(id){

result =
await supabaseClient
.from("employees")
.update(employeeData)
.eq("id",id)
.select()
.single();

}

else{

result =
await supabaseClient
.from("employees")
.insert([employeeData])
.select()
.single();

}


if(result.error){

console.error(result.error);

alert(
"Opslaan mislukt:\n\n" +
result.error.message
);

button.disabled = false;

button.textContent =
"Medewerker opslaan";

return;

}


closeEmployeeModal();

button.disabled = false;

button.textContent =
"Medewerker opslaan";


await loadEmployees();

}


/* =====================================================
DELETE EMPLOYEE
===================================================== */

async function deleteEmployee(id){

const employee =
employees.find(
item => item.id === id
);


if(!employee)
return;


const confirmed =
confirm(
`Weet je zeker dat je "${employee.name}" wilt verwijderen?`
);


if(!confirmed)
return;


const {
error
} =
await supabaseClient
.from("employees")
.delete()
.eq("id",id);


if(error){

alert(
"Verwijderen mislukt:\n\n" +
error.message
);

return;

}


closeProfileModal();

await loadEmployees();

}

/* =====================================================
HELPERS
===================================================== */

function getInitials(name){

if(!name)
return "M";


return name
.split(" ")
.filter(Boolean)
.slice(0,2)
.map(
part => part.charAt(0).toUpperCase()
)
.join("");

}


function statusClass(status){

if(status === "Inactief")
return "status status-inactive";


if(status === "Vakantie")
return "status status-vacation";


return "status status-active";

}


function whatsappNumber(phone){

return String(phone || "")
.replace(/\D/g,"");

}


function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
