<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC OS — Personeel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f7f5;
    color: #14211b;
}

header {
    height: 78px;
    background: white;
    border-bottom: 1px solid #dfe7e2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
}

.logo {
    height: 54px;
    width: auto;
    object-fit: contain;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 14px;
}

.user-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #2a654d;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
}

.logout {
    border: 1px solid #d9e2dd;
    background: white;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
}

.layout {
    display: flex;
    min-height: calc(100vh - 78px);
}

.sidebar {
    width: 220px;
    background: #064b39;
    color: white;
    padding: 22px 14px;
}

.nav-item {
    display: block;
    color: white;
    text-decoration: none;
    padding: 14px 15px;
    border-radius: 10px;
    margin-bottom: 7px;
    font-weight: 600;
}

.nav-item:hover,
.nav-item.active {
    background: #0c684e;
}

.section-title {
    color: #9cc3b4;
    font-size: 12px;
    font-weight: 700;
    margin: 25px 12px 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.main {
    flex: 1;
    padding: 30px;
    max-width: 1500px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    color: #68766f;
    margin-top: 6px;
}

.add-button {
    background: #28654d;
    color: white;
    border: none;
    border-radius: 11px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    border: 1px solid #dce5e0;
    border-radius: 16px;
    padding: 22px;
}

.stat-title {
    color: #6b7771;
    font-size: 15px;
}

.stat-number {
    color: #28654d;
    font-size: 34px;
    font-weight: 750;
    margin-top: 7px;
}

.card {
    background: white;
    border: 1px solid #dce5e0;
    border-radius: 16px;
    overflow: hidden;
}

.card-header {
    padding: 20px 22px;
    border-bottom: 1px solid #e4ebe7;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.card-header h2 {
    margin: 0;
    font-size: 20px;
}

.search {
    width: 320px;
    max-width: 100%;
    border: 1px solid #d8e1dc;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
}

.employee {
    display: grid;
    grid-template-columns: 2fr 1.3fr 1.3fr 1fr 1fr auto;
    align-items: center;
    gap: 15px;
    padding: 18px 22px;
    border-bottom: 1px solid #edf1ef;
}

.employee:last-child {
    border-bottom: none;
}

.name {
    font-weight: 700;
    font-size: 15px;
}

.email,
.phone {
    color: #6b7771;
    font-size: 13px;
    margin-top: 4px;
}

.badge {
    display: inline-flex;
    width: fit-content;
    padding: 7px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
}

.active {
    background: #e4f3eb;
    color: #26704e;
}

.inactive {
    background: #f0f1f1;
    color: #69716d;
}

.role {
    color: #39453f;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 7px;
}

.action {
    border: 1px solid #dbe4df;
    background: white;
    border-radius: 9px;
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 17px;
}

.action:hover {
    background: #f3f7f5;
}

.empty {
    padding: 60px 20px;
    text-align: center;
    color: #6d7973;
}

.loading {
    padding: 45px;
    text-align: center;
    color: #6d7973;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.42);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: white;
    width: 650px;
    max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 18px;
    padding: 26px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.modal-header h2 {
    margin: 0;
}

.close {
    border: none;
    background: #f0f3f1;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    cursor: pointer;
    font-size: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    font-weight: 650;
    color: #45514b;
}

input,
select {
    border: 1px solid #d5dfda;
    border-radius: 9px;
    padding: 12px;
    font-size: 14px;
    background: white;
}

.form-actions {
    margin-top: 24px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.cancel {
    border: 1px solid #d5dfda;
    background: white;
    border-radius: 9px;
    padding: 12px 18px;
    cursor: pointer;
}

.save {
    border: none;
    background: #28654d;
    color: white;
    border-radius: 9px;
    padding: 12px 20px;
    cursor: pointer;
    font-weight: 700;
}

.message {
    display: none;
    padding: 12px 15px;
    border-radius: 9px;
    margin-bottom: 15px;
    font-size: 14px;
}

.message.show {
    display: block;
}

.error {
    background: #fdeaea;
    color: #a32929;
}

.success {
    background: #e4f3eb;
    color: #26704e;
}

@media(max-width: 1000px) {
    .sidebar {
        width: 190px;
    }

    .employee {
        grid-template-columns: 2fr 1fr 1fr auto;
    }

    .employee .phone,
    .employee .role {
        display: none;
    }
}

@media(max-width: 700px) {
    header {
        padding: 0 15px;
    }

    .layout {
        display: block;
    }

    .sidebar {
        width: 100%;
        display: flex;
        overflow-x: auto;
        padding: 10px;
    }

    .nav-item {
        white-space: nowrap;
        margin: 0 4px;
    }

    .section-title {
        display: none;
    }

    .main {
        padding: 18px;
    }

    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .employee {
        grid-template-columns: 1fr auto;
    }

    .employee .email,
    .employee .phone,
    .employee .role {
        display: none;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<header>
    <img src="arc-logo-reference.jpg" class="logo" alt="ARC Cleaning Business">

    <div class="user-area">
        <button class="logout" onclick="logout()">Uitloggen</button>
        <div class="user-circle" id="userCircle">CA</div>
    </div>
</header>

<div class="layout">

    <aside class="sidebar">

        <a href="dashboard.html" class="nav-item">
            📊 Dashboard
        </a>

        <a href="dashboard.html" class="nav-item">
            👥 Leads
        </a>

        <a href="dashboard.html" class="nav-item">
            📅 Follow-ups
        </a>

        <a href="dashboard.html" class="nav-item">
            📄 Offertes
        </a>

        <a href="dashboard.html" class="nav-item">
            🤝 Klanten
        </a>

        <div class="section-title">Beheer</div>

        <a href="personeel.html" class="nav-item active">
            👨🏽‍🔧 Personeel
        </a>

        <a href="dashboard.html" class="nav-item">
            🏢 Locaties
        </a>

        <a href="dashboard.html" class="nav-item">
            💰 Facturen
        </a>

        <a href="dashboard.html" class="nav-item">
            ⚙️ Instellingen
        </a>

    </aside>

    <main class="main">

        <div class="topbar">

            <div>
                <h1>Personeel</h1>
                <div class="subtitle">
                    Beheer je medewerkers en hun gegevens.
                </div>
            </div>

            <button class="add-button" onclick="openAddModal()">
                + Nieuwe medewerker
            </button>

        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-title">Totaal personeel</div>
                <div class="stat-number" id="totalEmployees">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">Actieve medewerkers</div>
                <div class="stat-number" id="activeEmployees">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">Inactief</div>
                <div class="stat-number" id="inactiveEmployees">0</div>
            </div>

        </div>

        <div id="message" class="message"></div>

        <div class="card">

            <div class="card-header">

                <h2>Medewerkers</h2>

                <input
                    id="search"
                    class="search"
                    type="search"
                    placeholder="Zoek medewerker..."
                    oninput="renderEmployees()"
                >

            </div>

            <div id="employeeList">
                <div class="loading">
                    Personeel laden...
                </div>
            </div>

        </div>

    </main>

</div>


<!-- MODAL -->

<div class="modal" id="employeeModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">Nieuwe medewerker</h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>

        <form id="employeeForm">

            <input type="hidden" id="employeeId">

            <div class="form-grid">

                <div class="field">
                    <label>Voornaam</label>
                    <input id="firstName" required>
                </div>

                <div class="field">
                    <label>Achternaam</label>
                    <input id="lastName" required>
                </div>

                <div class="field">
                    <label>E-mail</label>
                    <input id="email" type="email">
                </div>

                <div class="field">
                    <label>Telefoon</label>
                    <input id="phone" type="tel">
                </div>

                <div class="field">
                    <label>Functie</label>
                    <input
                        id="jobTitle"
                        value="Schoonmaakmedewerker"
                    >
                </div>

                <div class="field">
                    <label>Rol</label>

                    <select id="role">

                        <option value="Medewerker">
                            Medewerker
                        </option>

                        <option value="Teamleider">
                            Teamleider
                        </option>

                        <option value="Planner">
                            Planner
                        </option>

                        <option value="Manager">
                            Manager
                        </option>

                        <option value="Admin">
                            Admin
                        </option>

                    </select>
                </div>

                <div class="field">
                    <label>Uurloon (€)</label>
                    <input
                        id="hourlyRate"
                        type="number"
                        step="0.01"
                        min="0"
                    >
                </div>

                <div class="field">
                    <label>Status</label>

                    <select id="status">

                        <option value="Actief">
                            Actief
                        </option>

                        <option value="Inactief">
                            Inactief
                        </option>

                    </select>
                </div>

            </div>

            <div class="form-actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="closeModal()"
                >
                    Annuleren
                </button>

                <button
                    type="submit"
                    class="save"
                >
                    Opslaan
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://dsmiokncislpdwhauleu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FGXia9BmU2mW2yYv9iwfxw_hvhMFnbB";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   STATE
========================================================= */

let employees = [];
let editingId = null;


/* =========================================================
   LOGIN CHECK
========================================================= */

async function checkLogin() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        window.location.href = "index.html";
        return false;
    }

    const email =
        session.user.email || "";

    document.getElementById("userCircle").textContent =
        email.substring(0, 2).toUpperCase();

    return true;
}


/* =========================================================
   LOAD EMPLOYEES
========================================================= */

async function loadEmployees() {

    const {
        data,
        error
    } = await supabaseClient
        .from("employees")
        .select("*")
        .order("first_name", {
            ascending: true
        });

    if (error) {

        showMessage(
            "Personeel kon niet worden geladen: " +
            error.message,
            "error"
        );

        document.getElementById("employeeList").innerHTML = `
            <div class="empty">
                Er ging iets mis bij het laden van het personeel.
            </div>
        `;

        return;
    }

    employees = data || [];

    updateStats();

    renderEmployees();
}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    const total =
        employees.length;

    const active =
        employees.filter(
            employee =>
                employee.status === "Actief"
        ).length;

    const inactive =
        employees.filter(
            employee =>
                employee.status !== "Actief"
        ).length;

    document.getElementById(
        "totalEmployees"
    ).textContent = total;

    document.getElementById(
        "activeEmployees"
    ).textContent = active;

    document.getElementById(
        "inactiveEmployees"
    ).textContent = inactive;
}


/* =========================================================
   RENDER
========================================================= */

function renderEmployees() {

    const container =
        document.getElementById("employeeList");

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const filtered =
        employees.filter(employee => {

            const text = [

                employee.first_name,
                employee.last_name,
                employee.email,
                employee.phone,
                employee.role,
                

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();

            return text.includes(search);
        });


    if (!filtered.length) {

        container.innerHTML = `
            <div class="empty">
                ${
                    employees.length
                    ? "Geen medewerkers gevonden."
                    : "Nog geen medewerkers. Klik op '+ Nieuwe medewerker' om de eerste toe te voegen."
                }
            </div>
        `;

        return;
    }


    container.innerHTML =
        filtered.map(employee => {

            const name =
                `${employee.first_name || ""}
                 ${employee.last_name || ""}`.trim();

            const status =
                employee.status || "Actief";

            const statusClass =
                status === "Actief"
                ? "active"
                : "inactive";

            const rate =
                employee.hourly_rate !== null &&
                employee.hourly_rate !== undefined
                ? `€ ${Number(employee.hourly_rate).toFixed(2)}`
                : "—";


            return `

                <div class="employee">

                    <div>
                        <div class="name">
                            ${escapeHtml(name || "Naam onbekend")}
                        </div>

                        <div class="email">
                            ${escapeHtml(employee.email || "Geen e-mail")}
                        </div>
                    </div>

                    <div class="role">
                        ${escapeHtml(
                            employee.job_title ||
                            employee.role ||
                            "Medewerker"
                        )}
                    </div>

                    <div class="phone">
                        ${escapeHtml(
                            employee.phone ||
                            "Geen telefoon"
                        )}
                    </div>

                    <div>
                        <span class="badge ${statusClass}">
                            ${escapeHtml(status)}
                        </span>
                    </div>

                    <div class="role">
                        ${rate}
                    </div>

                    <div class="actions">

                        <button
                            class="action"
                            title="Bewerken"
                            onclick="openEditModal('${employee.id}')"
                        >
                            ✏️
                        </button>

                        <button
                            class="action"
                            title="Verwijderen"
                            onclick="deleteEmployee('${employee.id}')"
                        >
                            🗑️
                        </button>

                    </div>

                </div>

            `;

        }).join("");
}


/* =========================================================
   ADD
========================================================= */

function openAddModal() {

    editingId = null;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Nieuwe medewerker";

    document.getElementById(
        "employeeForm"
    ).reset();

    document.getElementById(
        "employeeId"
    ).value = "";

    document.getElementById(
        "jobTitle"
    ).value =
        "Schoonmaakmedewerker";

    document.getElementById(
        "status"
    ).value =
        "Actief";

    document.getElementById(
        "employeeModal"
    ).classList.add("show");
}


/* =========================================================
   EDIT
========================================================= */

function openEditModal(id) {

    const employee =
        employees.find(
            item => item.id === id
        );

    if (!employee) return;

    editingId = id;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Medewerker bewerken";

    document.getElementById(
        "employeeId"
    ).value =
        employee.id;

    document.getElementById(
        "firstName"
    ).value =
        employee.first_name || "";

    document.getElementById(
        "lastName"
    ).value =
        employee.last_name || "";

    document.getElementById(
        "email"
    ).value =
        employee.email || "";

    document.getElementById(
        "phone"
    ).value =
        employee.phone || "";

    document.getElementById(
        "jobTitle"
    ).value =
        employee.job_title ||
        "Schoonmaakmedewerker";

    document.getElementById(
        "role"
    ).value =
        employee.role ||
        "Medewerker";

    document.getElementById(
        "hourlyRate"
    ).value =
        employee.hourly_rate ?? "";

    document.getElementById(
        "status"
    ).value =
        employee.status ||
        "Actief";

    document.getElementById(
        "employeeModal"
    ).classList.add("show");
}


/* =========================================================
   CLOSE
========================================================= */

function closeModal() {

    document.getElementById(
        "employeeModal"
    ).classList.remove("show");
}


/* =========================================================
   SAVE
========================================================= */

document.getElementById(
    "employeeForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const payload = {

            first_name:
                document.getElementById(
                    "firstName"
                ).value.trim(),

            last_name:
                document.getElementById(
                    "lastName"
                ).value.trim(),

            email:
                document.getElementById(
                    "email"
                ).value.trim() || null,

            phone:
                document.getElementById(
                    "phone"
                ).value.trim() || null,

            job_title:
                document.getElementById(
                    "jobTitle"
                ).value.trim() ||
                "Schoonmaakmedewerker",

            role:
                document.getElementById(
                    "role"
                ).value,

            hourly_rate:
                document.getElementById(
                    "hourlyRate"
                ).value
                ? Number(
                    document.getElementById(
                        "hourlyRate"
                    ).value
                  )
                : null,

            status:
                document.getElementById(
                    "status"
                ).value,

            updated_at:
                new Date().toISOString()
        };


        let result;


        if (editingId) {

            result =
                await supabaseClient
                    .from("employees")
                    .update(payload)
                    .eq("id", editingId);

        } else {

            result =
                await supabaseClient
                    .from("employees")
                    .insert(payload);

        }


        if (result.error) {

            showMessage(
                "Opslaan mislukt: " +
                result.error.message,
                "error"
            );

            return;
        }


        closeModal();

        showMessage(
            editingId
                ? "Medewerker bijgewerkt."
                : "Nieuwe medewerker toegevoegd.",
            "success"
        );

        await loadEmployees();
    }
);


/* =========================================================
   DELETE
========================================================= */

async function deleteEmployee(id) {

    const employee =
        employees.find(
            item => item.id === id
        );

    if (!employee) return;

    const name =
        `${employee.first_name || ""}
         ${employee.last_name || ""}`.trim();

    const confirmed =
        confirm(
            `Weet je zeker dat je ${name} wilt verwijderen?`
        );

    if (!confirmed) return;


    const {
        error
    } = await supabaseClient
        .from("employees")
        .delete()
        .eq("id", id);


    if (error) {

        showMessage(
            "Verwijderen mislukt: " +
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "Medewerker verwijderd.",
        "success"
    );

    await loadEmployees();
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type) {

    const element =
        document.getElementById("message");

    element.textContent = text;

    element.className =
        `message show ${type}`;

    setTimeout(() => {

        element.classList.remove("show");

    }, 4000);
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "index.html";
}


/* =========================================================
   START
========================================================= */

(async function() {

    const loggedIn =
        await checkLogin();

    if (loggedIn) {
        await loadEmployees();
    }

})();
