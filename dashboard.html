<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARC OS — Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --green:#07583f;
    --green-dark:#064632;
    --green-light:#e9f3ee;
    --bg:#f5f8f6;
    --white:#ffffff;
    --text:#14201b;
    --muted:#6b7772;
    --border:#dce5e0;
    --blue:#e7f0ff;
    --blue-text:#245a9b;
    --yellow:#fff2cf;
    --yellow-text:#8b6500;
    --red:#ffe5e5;
    --red-text:#b42318;
    --purple:#eee8ff;
    --purple-text:#6548a8;
    --shadow:0 4px 20px rgba(0,0,0,.05);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    height:82px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    height:55px;
    width:auto;
    object-fit:contain;
}

.user{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--green);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.layout{
    display:flex;
    min-height:calc(100vh - 82px);
}

.sidebar{
    width:235px;
    background:var(--green-dark);
    color:white;
    padding:24px 14px;
    flex-shrink:0;
}

.nav-title{
    font-size:12px;
    letter-spacing:1.5px;
    opacity:.6;
    margin:20px 12px 8px;
}

.nav-item{
    width:100%;
    border:0;
    background:transparent;
    color:white;
    padding:13px 14px;
    border-radius:10px;
    text-align:left;
    font-weight:600;
    margin-bottom:4px;
}

.nav-item:hover,
.nav-item.active{
    background:#08724f;
}

.main{
    flex:1;
    padding:30px;
    min-width:0;
}

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:24px;
}

.page-title{
    margin:0;
    font-size:32px;
}

.page-subtitle{
    margin:6px 0 0;
    color:var(--muted);
}

.primary{
    background:var(--green);
    color:white;
    border:0;
    padding:13px 20px;
    border-radius:10px;
    font-weight:700;
}

.primary:hover{
    background:#08694b;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:24px;
}

.stat{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    box-shadow:var(--shadow);
}

.stat-label{
    color:var(--muted);
    font-size:15px;
    margin-bottom:8px;
}

.stat-value{
    color:var(--green);
    font-size:34px;
    font-weight:800;
}

.toolbar{
    background:white;
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    display:flex;
    gap:12px;
    margin-bottom:16px;
}

.search{
    flex:1;
    min-width:0;
}

.search input,
.toolbar select{
    width:100%;
    height:46px;
    border:1px solid var(--border);
    border-radius:9px;
    padding:0 14px;
    outline:none;
    background:white;
}

.search input:focus,
.toolbar select:focus{
    border-color:var(--green);
}

.leads-card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

.lead-row{
    display:grid;
    grid-template-columns:2.2fr 1.2fr 1fr 1fr auto;
    gap:18px;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid #edf1ef;
}

.lead-row:last-child{
    border-bottom:0;
}

.company{
    font-weight:800;
    font-size:16px;
}

.contact{
    color:var(--muted);
    font-size:14px;
    margin-top:4px;
}

.badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:max-content;
    padding:7px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.status-new{
    background:#edf1ef;
    color:#59645f;
}

.status-email{
    background:var(--blue);
    color:var(--blue-text);
}

.status-call{
    background:var(--purple);
    color:var(--purple-text);
}

.status-warm{
    background:var(--yellow);
    color:var(--yellow-text);
}

.status-closed{
    background:#e8f7ec;
    color:#27733e;
}

.priority-normal{
    background:var(--yellow);
    color:var(--yellow-text);
}

.priority-high{
    background:var(--red);
    color:var(--red-text);
}

.priority-low{
    background:#edf1ef;
    color:#59645f;
}

.actions{
    display:flex;
    gap:7px;
    justify-content:flex-end;
}

.icon-btn{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    background:white;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.icon-btn:hover{
    background:var(--green-light);
}

.icon-btn:disabled{
    opacity:.3;
    cursor:not-allowed;
    background:#f5f6f5;
}

.empty{
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
}

.loading{
    padding:50px;
    text-align:center;
    color:var(--muted);
}

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    background:white;
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:18px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:24px;
}

.modal-title{
    margin:0;
    font-size:25px;
}

.close{
    border:0;
    background:#f1f4f2;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-size:13px;
    font-weight:700;
}

.form-group input,
.form-group select,
.form-group textarea{
    border:1px solid var(--border);
    border-radius:9px;
    padding:11px 12px;
    outline:none;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:24px;
}

.secondary{
    border:1px solid var(--border);
    background:white;
    padding:12px 18px;
    border-radius:9px;
    font-weight:600;
}

.danger{
    background:#fff0f0;
    color:#b42318;
    border:1px solid #ffd1d1;
    padding:12px 18px;
    border-radius:9px;
    font-weight:700;
}

.toast{
    position:fixed;
    right:22px;
    bottom:22px;
    background:#14201b;
    color:white;
    padding:14px 18px;
    border-radius:10px;
    display:none;
    z-index:200;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.toast.show{
    display:block;
}

@media(max-width:1000px){
    .sidebar{
        width:190px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .lead-row{
        grid-template-columns:2fr 1fr 1fr auto;
    }

    .lead-contact{
        display:none;
    }
}

@media(max-width:720px){
    .topbar{
        height:70px;
        padding:0 16px;
    }

    .logo{
        height:48px;
    }

    .layout{
        display:block;
    }

    .sidebar{
        width:100%;
        padding:8px;
        display:flex;
        overflow-x:auto;
        gap:5px;
    }

    .nav-title{
        display:none;
    }

    .nav-item{
        width:auto;
        white-space:nowrap;
        margin:0;
    }

    .main{
        padding:18px 12px;
    }

    .page-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .page-title{
        font-size:27px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat{
        padding:16px;
    }

    .stat-value{
        font-size:28px;
    }

    .toolbar{
        flex-direction:column;
    }

    .lead-row{
        grid-template-columns:1fr auto;
        gap:10px;
        padding:16px;
    }

    .lead-status,
    .lead-priority{
        display:none;
    }

    .actions{
        grid-row:1/3;
        grid-column:2;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <img
        src="arc-logo-reference.jpg"
        class="logo"
        alt="ARC Cleaning Business"
        onerror="this.style.display='none'"
    >

    <div class="user">CA</div>

</header>

<div class="layout">

    <aside class="sidebar">

        <button class="nav-item active" onclick="showSection('leads')">
            👥 Leads
        </button>

        <button class="nav-item" onclick="showSection('followups')">
            📅 Follow-ups
        </button>

        <button class="nav-item" onclick="showSection('offers')">
            📄 Offertes
        </button>

        <button class="nav-item" onclick="showSection('customers')">
            🤝 Klanten
        </button>

        <div class="nav-title">BEHEER</div>

        <button class="nav-item">
            👷 Personeel
        </button>

        <button class="nav-item">
            🏢 Locaties
        </button>

        <button class="nav-item">
            💰 Facturen
        </button>

        <button class="nav-item">
            ⚙️ Instellingen
        </button>

    </aside>

    <main class="main">

        <section id="leadsSection">

            <div class="page-header">

                <div>
                    <h1 class="page-title">Leads</h1>
                    <p class="page-subtitle">
                        Beheer je potentiële klanten vanuit één overzicht.
                    </p>
                </div>

                <button class="primary" onclick="openNewLead()">
                    + Nieuwe lead
                </button>

            </div>

            <div class="stats">

                <div class="stat">
                    <div class="stat-label">Totale leads</div>
                    <div class="stat-value" id="totalLeads">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Warme leads</div>
                    <div class="stat-value" id="warmLeads">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Openstaande offertes</div>
                    <div class="stat-value" id="openOffers">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Actieve klanten</div>
                    <div class="stat-value" id="activeCustomers">0</div>
                </div>

            </div>

            <div class="toolbar">

                <div class="search">
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Zoek bedrijf, contactpersoon of e-mail..."
                        oninput="renderLeads()"
                    >
                </div>

                <div style="width:190px">
                    <select id="statusFilter" onchange="renderLeads()">
                        <option value="">Alle statussen</option>
                        <option value="Nieuw">Nieuw</option>
                        <option value="E-mail gestuurd">E-mail gestuurd</option>
                        <option value="Gebeld">Gebeld</option>
                        <option value="Warm">Warm</option>
                        <option value="Klant">Klant</option>
                        <option value="Geen interesse">Geen interesse</option>
                    </select>
                </div>

            </div>

            <div class="leads-card">

                <div id="leadsContainer">
                    <div class="loading">
                        Leads laden...
                    </div>
                </div>

            </div>

        </section>

        <section id="placeholderSection" style="display:none">

            <div class="page-header">
                <div>
                    <h1 class="page-title" id="placeholderTitle">
                        Onderdeel
                    </h1>

                    <p class="page-subtitle">
                        Dit onderdeel bouwen we als volgende stap.
                    </p>
                </div>
            </div>

            <div class="leads-card">
                <div class="empty">
                    🚧 Dit onderdeel komt eraan.
                </div>
            </div>

        </section>

    </main>

</div>


<!-- LEAD MODAL -->

<div class="modal-bg" id="leadModal">

    <div class="modal">

        <div class="modal-header">

            <div>
                <h2 class="modal-title" id="modalTitle">
                    Nieuwe lead
                </h2>
            </div>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Bedrijfsnaam *</label>
                <input id="companyInput" placeholder="Bijv. CURO Vastgoed">
            </div>

            <div class="form-group">
                <label>Contactpersoon</label>
                <input id="contactInput" placeholder="Naam contactpersoon">
            </div>

            <div class="form-group">
                <label>E-mailadres</label>
                <input id="emailInput" type="email" placeholder="naam@bedrijf.nl">
            </div>

            <div class="form-group">
                <label>Telefoonnummer</label>
                <input id="phoneInput" type="tel" placeholder="06 12345678">
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="statusInput">
                    <option>Nieuw</option>
                    <option>E-mail gestuurd</option>
                    <option>Gebeld</option>
                    <option>Warm</option>
                    <option>Klant</option>
                    <option>Geen interesse</option>
                </select>
            </div>

            <div class="form-group">
                <label>Prioriteit</label>
                <select id="priorityInput">
                    <option>Normaal</option>
                    <option>Hoog</option>
                    <option>Laag</option>
                </select>
            </div>

            <div class="form-group full">
                <label>Adres</label>
                <input id="addressInput" placeholder="Straat + huisnummer, plaats">
            </div>

            <div class="form-group full">
                <label>Notities</label>
                <textarea id="notesInput" placeholder="Notities over deze lead..."></textarea>
            </div>

        </div>

        <div class="modal-footer">

            <button
                class="danger"
                id="deleteFromModal"
                style="display:none"
                onclick="deleteCurrentLead()">
                Verwijderen
            </button>

            <button class="secondary" onclick="closeModal()">
                Annuleren
            </button>

            <button class="primary" onclick="saveLead()">
                Opslaan
            </button>

        </div>

    </div>

</div>

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://dsmiokncislpdwhauleu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FGXia9BmU2mW2yYv9iwfxw_hvhMFnbB";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBAL STATE
========================================================= */

let leads = [];
let editingLeadId = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function getField(lead, names){

    for(const name of names){

        if(
            lead[name] !== undefined &&
            lead[name] !== null
        ){
            return lead[name];
        }

    }

    return "";
}


function normalizeStatus(value){

    if(!value) return "Nieuw";

    const v = String(value).toLowerCase();

    if(v.includes("email") || v.includes("e-mail")){
        return "E-mail gestuurd";
    }

    if(v.includes("gebeld") || v.includes("call")){
        return "Gebeld";
    }

    if(v.includes("warm")){
        return "Warm";
    }

    if(v.includes("klant")){
        return "Klant";
    }

    if(v.includes("geen interesse")){
        return "Geen interesse";
    }

    return "Nieuw";
}


function normalizePriority(value){

    if(!value) return "Normaal";

    const v = String(value).toLowerCase();

    if(v.includes("hoog") || v.includes("high")){
        return "Hoog";
    }

    if(v.includes("laag") || v.includes("low")){
        return "Laag";
    }

    return "Normaal";
}


function statusClass(status){

    switch(status){

        case "E-mail gestuurd":
            return "status-email";

        case "Gebeld":
            return "status-call";

        case "Warm":
            return "status-warm";

        case "Klant":
            return "status-closed";

        default:
            return "status-new";
    }
}


function priorityClass(priority){

    switch(priority){

        case "Hoog":
            return "priority-high";

        case "Laag":
            return "priority-low";

        default:
            return "priority-normal";
    }
}


function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },3000);
}


/* =========================================================
   LOAD LEADS
========================================================= */

async function loadLeads(){

    const container =
        document.getElementById("leadsContainer");

    container.innerHTML =
        `<div class="loading">Leads laden...</div>`;

    const { data, error } =
        await supabaseClient
            .from("leads")
            .select("*")
            .order("created_at", {
                ascending:false
            });

    if(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                <strong>Leads konden niet worden geladen.</strong>
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

        return;
    }

    leads = data || [];

    updateStats();
    renderLeads();
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    document.getElementById("totalLeads")
        .textContent = leads.length;

    const warm =
        leads.filter(lead =>
            normalizeStatus(
                getField(lead,["status"])
            ) === "Warm"
        ).length;

    document.getElementById("warmLeads")
        .textContent = warm;

    const offers =
        leads.filter(lead => {

            const status =
                normalizeStatus(
                    getField(lead,["status"])
                );

            return status === "Warm";

        }).length;

    document.getElementById("openOffers")
        .textContent = offers;

    const customers =
        leads.filter(lead =>
            normalizeStatus(
                getField(lead,["status"])
            ) === "Klant"
        ).length;

    document.getElementById("activeCustomers")
        .textContent = customers;
}


/* =========================================================
   RENDER LEADS
========================================================= */

function renderLeads(){

    const container =
        document.getElementById("leadsContainer");

    const search =
        document.getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    const statusFilter =
        document.getElementById("statusFilter")
            .value;

    let filtered = leads.filter(lead => {

        const company =
            String(
                getField(
                    lead,
                    ["company_name","bedrijf","company"]
                )
            ).toLowerCase();

        const contact =
            String(
                getField(
                    lead,
                    ["contact_name","contactpersoon","contact"]
                )
            ).toLowerCase();

        const email =
            String(
                getField(
                    lead,
                    ["email","e_mail"]
                )
            ).toLowerCase();

        const status =
            normalizeStatus(
                getField(
                    lead,
                    ["status"]
                )
            );

        const matchesSearch =
            !search ||
            company.includes(search) ||
            contact.includes(search) ||
            email.includes(search);

        const matchesStatus =
            !statusFilter ||
            status === statusFilter;

        return matchesSearch && matchesStatus;

    });


    if(!filtered.length){

        container.innerHTML = `
            <div class="empty">
                <div style="font-size:42px;margin-bottom:12px">
                    🔍
                </div>

                <strong>Geen leads gevonden</strong>

                <div style="margin-top:6px">
                    Pas je zoekopdracht of filter aan.
                </div>
            </div>
        `;

        return;
    }


    container.innerHTML =
        filtered.map(lead => {

            const id =
                getField(lead,["id","uuid"]);

            const company =
                getField(
                    lead,
                    ["company_name","bedrijf","company"]
                ) || "Onbekend bedrijf";

            const contact =
                getField(
                    lead,
                    ["contact_name","contactpersoon","contact"]
                ) || "Geen contactpersoon";

            const email =
                getField(
                    lead,
                    ["email","e_mail"]
                );

            const phone =
                getField(
                    lead,
                    ["phone","telephone","telefoon"]
                );

            const status =
                normalizeStatus(
                    getField(lead,["status"])
                );

            const priority =
                normalizePriority(
                    getField(
                        lead,
                        ["priority","prioriteit"]
                    )
                );


            return `

                <div class="lead-row">

                    <div>

                        <div class="company">
                            ${escapeHTML(company)}
                        </div>

                        <div class="contact">
                            ${escapeHTML(contact)}
                        </div>

                    </div>


                    <div class="lead-contact">

                        ${
                            email
                            ?
                            `<span style="font-size:14px">
                                ${escapeHTML(email)}
                             </span>`
                            :
                            `<span class="contact">
                                Geen e-mail
                             </span>`
                        }

                    </div>


                    <div class="lead-status">

                        <span class="badge ${statusClass(status)}">
                            ${escapeHTML(status)}
                        </span>

                    </div>


                    <div class="lead-priority">

                        <span class="badge ${priorityClass(priority)}">
                            ${escapeHTML(priority)}
                        </span>

                    </div>


                    <div class="actions">

                        <button
                            class="icon-btn"
                            title="${
                                phone
                                ? "Bel " + phone
                                : "Geen telefoonnummer"
                            }"
                            ${
                                phone
                                ?
                                `onclick="callLead('${encodeURIComponent(phone)}')"`
                                :
                                "disabled"
                            }>
                            📞
                        </button>


                        <button
                            class="icon-btn"
                            title="${
                                email
                                ? "E-mail " + email
                                : "Geen e-mailadres"
                            }"
                            ${
                                email
                                ?
                                `onclick="emailLead('${encodeURIComponent(email)}')"`
                                :
                                "disabled"
                            }>
                            ✉️
                        </button>


                        <button
                            class="icon-btn"
                            title="Lead bekijken"
                            onclick="openEditLead('${id}')">
                            ✏️
                        </button>


                        <button
                            class="icon-btn"
                            title="Lead verwijderen"
                            onclick="deleteLead('${id}')">
                            🗑️
                        </button>

                    </div>

                </div>

            `;

        }).join("");
}


/* =========================================================
   CALL / EMAIL
========================================================= */

function callLead(encodedPhone){

    const phone =
        decodeURIComponent(encodedPhone);

    if(!phone) return;

    window.location.href =
        "tel:" + phone;
}


function emailLead(encodedEmail){

    const email =
        decodeURIComponent(encodedEmail);

    if(!email) return;

    window.location.href =
        "mailto:" + email;
}


/* =========================================================
   NEW LEAD
========================================================= */

function openNewLead(){

    editingLeadId = null;

    document.getElementById("modalTitle")
        .textContent = "Nieuwe lead";

    document.getElementById("companyInput").value = "";
    document.getElementById("contactInput").value = "";
    document.getElementById("emailInput").value = "";
    document.getElementById("phoneInput").value = "";
    document.getElementById("addressInput").value = "";
    document.getElementById("notesInput").value = "";

    document.getElementById("statusInput").value =
        "Nieuw";

    document.getElementById("priorityInput").value =
        "Normaal";

    document.getElementById("deleteFromModal")
        .style.display = "none";

    document.getElementById("leadModal")
        .classList.add("show");
}


/* =========================================================
   EDIT LEAD
========================================================= */

function openEditLead(id){

    const lead =
        leads.find(item =>
            String(
                getField(item,["id","uuid"])
            ) === String(id)
        );

    if(!lead){
        showToast("Lead niet gevonden.");
        return;
    }

    editingLeadId = id;

    document.getElementById("modalTitle")
        .textContent = "Lead bewerken";


    document.getElementById("companyInput").value =
        getField(
            lead,
            ["company_name","bedrijf","company"]
        ) || "";


    document.getElementById("contactInput").value =
        getField(
            lead,
            ["contact_name","contactpersoon","contact"]
        ) || "";


    document.getElementById("emailInput").value =
        getField(
            lead,
            ["email","e_mail"]
        ) || "";


    document.getElementById("phoneInput").value =
        getField(
            lead,
            ["phone","telephone","telefoon"]
        ) || "";


    document.getElementById("addressInput").value =
        getField(
            lead,
            ["address","adres"]
        ) || "";


    document.getElementById("notesInput").value =
        getField(
            lead,
            ["notes","notities","extra_info","extra_information"]
        ) || "";


    document.getElementById("statusInput").value =
        normalizeStatus(
            getField(lead,["status"])
        );


    document.getElementById("priorityInput").value =
        normalizePriority(
            getField(
                lead,
                ["priority","prioriteit"]
            )
        );


    document.getElementById("deleteFromModal")
        .style.display = "block";


    document.getElementById("leadModal")
        .classList.add("show");
}


/* =========================================================
   SAVE LEAD
========================================================= */

async function saveLead(){

    const company =
        document.getElementById("companyInput")
            .value
            .trim();

    if(!company){

        showToast(
            "Vul eerst een bedrijfsnaam in."
        );

        return;
    }


    const contact =
        document.getElementById("contactInput")
            .value
            .trim();

    const email =
        document.getElementById("emailInput")
            .value
            .trim();

    const phone =
        document.getElementById("phoneInput")
            .value
            .trim();

    const address =
        document.getElementById("addressInput")
            .value
            .trim();

    const notes =
        document.getElementById("notesInput")
            .value
            .trim();

    const status =
        document.getElementById("statusInput")
            .value;

    const priority =
        document.getElementById("priorityInput")
            .value;


    /*
       We gebruiken de kolommen die jouw
       huidige leads-tabel duidelijk heeft.
    */

    const payload = {

        company_name: company,

        contact_name:
            contact || null,

        email:
            email || null,

        phone:
            phone || null,

        address:
            address || null,

        status:
            status,

        priority:
            priority,

        notes:
            notes || null

    };


    let result;


    if(editingLeadId){

        result =
            await supabaseClient
                .from("leads")
                .update(payload)
                .eq("id", editingLeadId);

    }else{

        result =
            await supabaseClient
                .from("leads")
                .insert(payload);

    }


    if(result.error){

        console.error(result.error);

        showToast(
            "Opslaan mislukt: " +
            result.error.message
        );

        return;
    }


    showToast(
        editingLeadId
        ? "Lead bijgewerkt."
        : "Nieuwe lead toegevoegd."
    );


    closeModal();

    await loadLeads();
}


/* =========================================================
   DELETE
========================================================= */

async function deleteLead(id){

    const lead =
        leads.find(item =>
            String(
                getField(item,["id","uuid"])
            ) === String(id)
        );

    if(!lead) return;


    const company =
        getField(
            lead,
            ["company_name","bedrijf","company"]
        ) || "deze lead";


    const confirmed =
        confirm(
            `Weet je zeker dat je "${company}" wilt verwijderen?`
        );


    if(!confirmed) return;


    const { error } =
        await supabaseClient
            .from("leads")
            .delete()
            .eq("id", id);


    if(error){

        console.error(error);

        showToast(
            "Verwijderen mislukt: " +
            error.message
        );

        return;
    }


    showToast("Lead verwijderd.");

    await loadLeads();
}


async function deleteCurrentLead(){

    if(!editingLeadId) return;

    await deleteLead(editingLeadId);

    closeModal();
}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

    document.getElementById("leadModal")
        .classList.remove("show");

    editingLeadId = null;
}


document.getElementById("leadModal")
    .addEventListener("click",function(event){

        if(event.target === this){
            closeModal();
        }

    });


/* =========================================================
   NAVIGATION
========================================================= */

function showSection(section){

    const leadsSection =
        document.getElementById("leadsSection");

    const placeholder =
        document.getElementById("placeholderSection");

    if(section === "leads"){

        leadsSection.style.display = "block";
        placeholder.style.display = "none";

        return;
    }


    leadsSection.style.display = "none";
    placeholder.style.display = "block";


    const titles = {

        followups:"Follow-ups",

        offers:"Offertes",

        customers:"Klanten"

    };


    document.getElementById("placeholderTitle")
        .textContent =
        titles[section] || "Onderdeel";
}


/* =========================================================
   START
========================================================= */

loadLeads();

</script>
